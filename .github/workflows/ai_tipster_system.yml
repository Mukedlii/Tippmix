name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Restore Cache
        uses: actions/cache@v2
        with:
          path: .cache/
          key: tippmix-db-cache-${{ github.run_id }}
          restore-keys: |
            tippmix-db-cache-

  results:
    runs-on: ubuntu-latest
