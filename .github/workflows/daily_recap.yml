name: Szelvenykiraly Daily Recap

on:
  # kézzel is indítható
  workflow_dispatch:

  # minden nap 21:00 UTC (kb. 22:00 magyar idő télen)
  schedule:
    - cron: "0 21 * * *"

jobs:
  run-daily-recap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily recap bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
        run: python -m bot.daily_recap_main
