name: Daily Recap

on:
  schedule:
    - cron: '59 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      TIPPMIX_DB_PATH: data/tippmix.db
      TIPPMIX_SLOT: EVENING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily recap
        run: python -m bot.daily_recap_main

      - name: Commit recap data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/recap_sent.json data/recap_history.json || true
          if git diff --cached --quiet; then
            echo "No recap data changes"
          else
            git commit -m "📊 Daily recap update [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main --no-edit --allow-unrelated-histories 2>/dev/null || true
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after retries"
                exit 1
              fi
              echo "Push failed on attempt $attempt, retrying..."
              sleep 5
            done
          fi
