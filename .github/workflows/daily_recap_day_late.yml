name: Tippmix Late Day Recap

on:
  schedule:
    # Late recap so most DAY matches are finished.
    # 01:30 Europe/Budapest (winter) ~= 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap-day-late:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run late DAY recap
        env:
          TIPPMIX_SLOT: DAY
          TIPPMIX_FORCE_RECAP: '1'
        run: python -m bot.daily_recap_main
