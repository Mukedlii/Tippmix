name: Fix playwright_odds_scraper

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Write clean file from base64
        run: |
          echo "" | base64 -d > bot/providers/playwright_odds_scraper.py

      - name: Verify syntax
        run: python3 -m py_compile bot/providers/playwright_odds_scraper.py && echo "OK"

      - name: Commit and push
        run: |
          git config user.email "bot@github.com"
          git config user.name "GitHub Actions"
          git add bot/providers/playwright_odds_scraper.py
          git commit -m "fix: ASCII-clean playwright_odds_scraper.py"
          git push
