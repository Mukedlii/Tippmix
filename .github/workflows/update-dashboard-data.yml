name: Update Dashboard Data

on:
  schedule:
    # Run daily at 1:00 AM and 7:00 PM UTC (after tip generation)
    - cron: '0 1,19 * * *'
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main
    paths:
      - 'data/tippmix.db'  # Trigger when DB changes

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Generate dashboard JSON files
        env:
          TIPPMIX_DB_PATH: data/tippmix.db
        run: |
          python scripts/generate_dashboard_data.py
      
      - name: Commit and push if changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add dashboard/public/data/*.json
          git diff --staged --quiet || git commit -m "🔄 Update dashboard data [skip ci]"
          git push
