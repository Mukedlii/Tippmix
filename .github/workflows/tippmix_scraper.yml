name: Tippmix Scraper Pipeline

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scraper-pipeline:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      FOOTBALLDATA_API_KEY: ${{ secrets.FOOTBALLDATA_API_KEY }}

      TIPPMIX_DB_PATH: data/tippmix.db
      SPORTS_DATA_PROVIDER: free_scraper
      TIPPMIX_PREFER_SCRAPING: "1"
      TIPPMIX_ENABLE_SCRAPER_PIPELINE: "1"
      TIPPMIX_SEND_PUBLIC: "1"
      TIPPMIX_SEND_VIP: "1"
      TIPPMIX_SEND_EN: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper-first pipeline
        run: python -m bot.main

      - name: Generate dashboard data
        run: python scripts/generate_dashboard_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Git state before staging:"
          git status --short
          git add data/tippmix.db dashboard/public/data/*.json || true
          echo "Git state after staging:"
          git status --short
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "🔄 Scraper pipeline update [skip ci]"
            for attempt in 1 2 3; do
              stashed=0
              stash_ref=""
              echo "Attempt $attempt git state before pull --rebase:"
              git status --short
              if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
                echo "Stashing local changes before rebase"
                before_stash_count="$(git stash list | wc -l)"
                git stash push --include-untracked -m "scraper-pipeline-autostash-attempt-$attempt"
                after_stash_count="$(git stash list | wc -l)"
                if [ "$after_stash_count" -gt "$before_stash_count" ]; then
                  stashed=1
                  stash_ref="stash@{0}"
                fi
              fi

              if git pull --rebase origin main && git push origin HEAD:main; then
                if [ "$stashed" -eq 1 ]; then
                  # Stash is temporary only for rebase safety in this ephemeral CI workspace
                  git stash drop "$stash_ref" || true
                fi
                break
              fi

              if [ "$stashed" -eq 1 ]; then
                git stash drop "$stash_ref" || true
              fi

              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort || true
              fi
              # Force clean state between retries to avoid persistent dirty working tree rebase failures
              echo "Files before cleanup:"
              git status --short
              echo "Cleaning working tree before retry (discarding local uncommitted changes)"
              git reset --hard HEAD
              git clean -fd

              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after retries"
                exit 1
              fi

              echo "Push failed on attempt $attempt, retrying..."
              sleep 5
            done
          fi
