name: Tippmix Evening Tips

on:
  schedule:
    # 18:00-kor fusson minden nap (GMT+1)
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  tippmix-evening:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evening tips (16–23 meccsek)
        env:
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
          TIPPMIX_SLOT: EVENING
        run: |
          python -m bot.main

      - name: Run evening recap (16–23 meccsek)
        env:
          SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
          TIPPMIX_SLOT: EVENING
        run: |
          python -m bot.daily_recap_main
