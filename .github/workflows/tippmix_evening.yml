name: Tippmix Evening Tips + Day Recap

on:
  schedule:
    # 15:00 Europe/Budapest (téli időszámítás) = 14:00 UTC
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tips-evening-and-day-recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      # Provider selection (from Variables)
      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER }}

      # API kulcsok
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TIPPMIX_USE_ENSEMBLE: "0"

      # Modell és LLM beállítások
      TIPPMIX_MODEL: "gpt-4o-mini"
      TIPPMIX_USE_RESPONSES: "1"
      TIPPMIX_REASONING_EFFORT: "low"
      TIPPMIX_VERBOSITY: "low"
      TIPPMIX_TEMP: "0.25"

      # Kötelező tippszámok
      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      # Mennyi meccset dossziézunk (API hívások miatt fontos)
      TIPPMIX_ENRICH_LIMIT: "40"

      # Odds / nyeremény csak megjelenítéshez
      TIPPMIX_STAKE_HUF: "1000"

      SPORTS_API_TIMEZONE: "Europe/Budapest"

      # Quality / reliability controls
      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}
      TIPPMIX_MAX_DAYS_AHEAD: ${{ vars.TIPPMIX_MAX_DAYS_AHEAD }}
      
      # Marketing format (inline buttons + clean design)
      TIPPMIX_USE_MARKETING_FORMAT: "1"
      TIPPMIX_DASHBOARD_URL: "https://tippmix.vercel.app"
      TIPPMIX_VIP_URL: "https://tippmix.vercel.app/vip"
      TIPPMIX_BETTING_SITE: "tippmix"
      
      # Multi-sport support
      TIPPMIX_ENABLE_MULTI_SPORT: "1"
      TIPPMIX_EXTRA_SPORTS: "basketball,handball"
      
      # TheOddsAPI - több liga coverage
      ODDS_MAX_REQUESTS_PER_RUN: "20"
      ODDS_SPORT_KEYS: "soccer_epl,soccer_germany_bundesliga,soccer_italy_serie_a,soccer_spain_la_liga,soccer_france_ligue_one,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga,soccer_england_championship,soccer_uefa_europa_league,soccer_uefa_europa_conference_league"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening tips bot (EVENING)
        env:
          TIPPMIX_SLOT: EVENING
        run: python -m bot.main

      - name: Commit evening bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f public_bets_evening.json ]; then
            git add public_bets_evening.json
          fi
          if [ -f vip_bets_evening.json ]; then
            git add vip_bets_evening.json
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit for evening JSON."
          else
            git commit -m "Update evening bets JSON"
            git push
          fi

      - name: Run day recap (DAY)
        env:
          TIPPMIX_SLOT: DAY
        run: python -m bot.daily_recap_main
