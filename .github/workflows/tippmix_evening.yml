name: Tippmix Evening Tips + Day Recap

on:
  schedule:
    # 16:00 Europe/Budapest -> 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tips-evening-and-day-recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening tips bot (16–23 meccsek)
        env:
          TIPPMIX_SLOT: EVENING
        run: python -m bot.main

      - name: Commit evening bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f public_bets_evening.json ]; then
            git add public_bets_evening.json
          fi
          if [ -f vip_bets_evening.json ]; then
            git add vip_bets_evening.json
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit for evening JSON."
          else
            git commit -m "Update evening bets JSON"
            git push
          fi

      - name: Run day recap (09–16 meccsek)
        env:
          TIPPMIX_SLOT: DAY
        run: python -m bot.daily_recap_main
