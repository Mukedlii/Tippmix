name: Tippmix Evening Tips + Day Recap

on:
  schedule:
    # 16:00 Europe/Budapest -> 15:00 UTC
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tips-evening-and-day-recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

      # --- slot + model ---
      TIPPMIX_SLOT: EVENING
      TIPPMIX_MODEL: "gpt-5-mini"
      TIPPMIX_FALLBACK_MODEL: "gpt-4.1-mini"
      TIPPMIX_USE_RESPONSES: "1"
      TIPPMIX_REASONING_EFFORT: "low"
      TIPPMIX_VERBOSITY: "low"
      TIPPMIX_TEMP: "0.25"

      # --- minimum tippek (fizetős bot) ---
      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      TIPPMIX_MAX_ODDS_LOOKUP: "80"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening tips bot (16–23 meccsek)
        run: python -m bot.main

      - name: Commit evening bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f public_bets_evening.json ]; then
            git add public_bets_evening.json
          fi
          if [ -f vip_bets_evening.json ]; then
            git add vip_bets_evening.json
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit for evening JSON."
          else
            git commit -m "Update evening bets JSON"
            git push
          fi

      - name: Run day recap (09–16 meccsek)
        env:
          TIPPMIX_SLOT: DAY
        run: python -m bot.daily_recap_main
