name: Tippmix Weekly DB Refresh

on:
  schedule:
    # Weekly refresh + 1 week undo archive
    # Sundays 05:10 Europe/Budapest ~ 04:10 UTC (rough; GitHub cron is UTC)
    - cron: '10 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-db:
    runs-on: ubuntu-latest
    env:
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh results cache (last 7 days)
        run: python -m bot.refresh_results_cache --days 7 --max 600

      - name: Commit refreshed DB + archive (keep 1 week)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/tippmix.db || true
          git add data/archive || true

          # stage deletions from pruning
          git add -A data/archive || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Weekly DB refresh + archive" || true
            git push
          fi
