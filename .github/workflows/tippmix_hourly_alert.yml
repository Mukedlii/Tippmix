name: Tippmix Hourly PRO Alerts

on:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      # do not send FREE/public from this workflow
      TELEGRAM_PUBLIC_CHAT_ID: ""
      TIPPMIX_SEND_PUBLIC: "0"
      TIPPMIX_SEND_VIP: "1"
      TIPPMIX_SEND_EN: "1"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Provider keys
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER }}

      TIPPMIX_SLOT: ALL

      # alert mode
      TIPPMIX_ALERT_ONLY: "1"
      TIPPMIX_ALERT_CONF_MIN: "4.2"
      TIPPMIX_ALERT_ODDS_MIN: "1.35"
      TIPPMIX_ALERT_ODDS_MAX: "1.90"
      TIPPMIX_ALERT_MAX_PER_RUN: "6"

      # coverage
      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}
      TIPPMIX_ALLOW_YOUTH: "0"
      TIPPMIX_ALLOW_FRIENDLY: "0"

      # keep odds requests bounded
      ODDS_MAX_REQUESTS_PER_RUN: "6"
      ODDS_SPORT_KEYS: "soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_uefa_champs_league"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly alert scan
        run: python -m bot.main

      - name: Commit alert state (dedup)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/alert_state.json || true

          if git diff --cached --quiet; then
            echo "No alert state changes."
          else
            git commit -m "Update alert state" || true
            git push
          fi
