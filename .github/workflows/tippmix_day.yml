name: Tippmix Day Tips

on:
  schedule:
    # 09:00 Europe/Budapest -> 08:00 UTC (télen)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  tips-day:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run day tips bot (09–16 meccsek)
        env:
          TIPPMIX_SLOT: DAY
        run: python -m bot.main

      - name: Upload day bets JSON (for later recap)
        uses: actions/upload-artifact@v4
        with:
          name: bets_day
          path: |
            public_bets_day.json
            vip_bets_day.json
          if-no-files-found: ignore
