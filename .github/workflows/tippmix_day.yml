name: Tippmix Day Tips

on:
  workflow_dispatch:
  schedule:
    # 08:00 UTC ≈ 09:00 magyar idő (tél)
    - cron: "0 8 * * *"

jobs:
  run-tips-day:
    runs-on: ubuntu-latest
    env:
      TIPPMIX_SLOT: DAY
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run day tips (9–16 közti meccsek)
        run: python -m bot.main
