name: Tippmix Day Tips

on:
  schedule:
    # 09:00 Europe/Budapest (téli időszámítás) = 08:00 UTC
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tips-day:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      # API kulcsok
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      # Modell és LLM beállítások
      TIPPMIX_MODEL: "gpt-5-mini"
      TIPPMIX_USE_RESPONSES: "1"
      TIPPMIX_REASONING_EFFORT: "low"
      TIPPMIX_VERBOSITY: "low"
      TIPPMIX_TEMP: "0.25"

      # Kötelező tippszámok
      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      # Mennyi meccset dossziézunk (API hívások miatt fontos)
      TIPPMIX_ENRICH_LIMIT: "40"

      # Odds / nyeremény csak megjelenítéshez
      TIPPMIX_STAKE_HUF: "1000"

      # Opcionális: ha API-Sports időzónát használod
      SPORTS_API_TIMEZONE: "Europe/Budapest"

      # Quality / reliability controls
      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}
      TIPPMIX_MAX_DAYS_AHEAD: ${{ vars.TIPPMIX_MAX_DAYS_AHEAD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run day tips bot (DAY)
        env:
          TIPPMIX_SLOT: DAY
        run: python -m bot.main

      - name: Commit day bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f public_bets_day.json ]; then
            git add public_bets_day.json
          fi
          if [ -f vip_bets_day.json ]; then
            git add vip_bets_day.json
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit for day JSON."
          else
            git commit -m "Update day bets JSON"
            git push
          fi
