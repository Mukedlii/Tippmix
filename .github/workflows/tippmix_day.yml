name: Tippmix Day Tips

on:
  schedule:
    # 09:00 Europe/Budapest -> 08:00 UTC (téli időszámítás)
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tips-day:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}

      # --- slot + model ---
      TIPPMIX_SLOT: DAY
      TIPPMIX_MODEL: "gpt-5-mini"
      TIPPMIX_FALLBACK_MODEL: "gpt-4.1-mini"
      TIPPMIX_USE_RESPONSES: "1"
      TIPPMIX_REASONING_EFFORT: "low"
      TIPPMIX_VERBOSITY: "low"
      TIPPMIX_TEMP: "0.25"

      # --- minimum tippek (fizetős bot) ---
      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      # --- odds lookup limit (ne legyen túl lassú) ---
      TIPPMIX_MAX_ODDS_LOOKUP: "80"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run day tips bot (09–16 meccsek)
        run: python -m bot.main

      - name: Commit day bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f public_bets_day.json ]; then
            git add public_bets_day.json
          fi
          if [ -f vip_bets_day.json ]; then
            git add vip_bets_day.json
          fi

          if git diff --cached --quiet; then
            echo "Nothing to commit for day JSON."
          else
            git commit -m "Update day bets JSON"
            git push
          fi
