name: Szelvenykiraly Cron

on:
  workflow_dispatch:

  # DEBUG: 5 percenként fusson
  schedule:
    - cron: "*/5 * * * *"


jobs:
  run-bot:
    runs-on: ubuntu-latest

    # ITT adjuk át a secret-eket környezeti változóként
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SPORT_API_KEY: ${{ secrets.SPORT_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Force httpx version (fix proxies error)
        run: |
          pip install "httpx<0.28"

      - name: Run tippmix bot
        run: |
          python -m bot.main
