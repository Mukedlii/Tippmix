name: Szelvenykiraly Cron

on:
  schedule:
    # UTC idő! Igazítsd magyar időhöz, ha kell (+1/+2 óra).
    - cron: "0 5 * * *"   # reggeli tippek
    - cron: "0 13 * * *"  # délutáni tippek
    - cron: "0 19 * * *"  # esti tippek
  workflow_dispatch:      # manuálisan is el tudod indítani GitHub UI-ból

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Itt fixáljuk a httpx verziót, hogy ne legyen 'proxies' hiba az OpenAI kliensnél
      - name: Force httpx version (fix proxies error)
        run: |
          pip install "httpx<0.28"

      - name: Run tippmix bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
          TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SPORT_API_KEY: ${{ secrets.SPORT_API_KEY }}
        run: |
          python -m bot.main
