name: Tippmix Nightly Recap

on:
  schedule:
    # 03:00 Europe/Budapest (winter) ~= 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}

      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER }}

      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent Tippmix DB (cache)
        uses: actions/cache@v4
        with:
          path: |
            data/tippmix.db*
          key: tippmix-db-${{ github.run_id }}
          restore-keys: |
            tippmix-db-

      - name: Refresh results cache (backfill history)
        run: python -m bot.refresh_results_cache --days 21 --max 800

      - name: Run recap (DAY)
        env:
          TIPPMIX_SLOT: DAY
          TIPPMIX_FORCE_RECAP: "1"
        run: python -m bot.daily_recap_main

      - name: Run recap (EVENING)
        env:
          TIPPMIX_SLOT: EVENING
          TIPPMIX_FORCE_RECAP: "1"
        run: python -m bot.daily_recap_main

      - name: DB metrics (temporary)
        run: |
          python - <<'PY'
          import sqlite3

          con = sqlite3.connect('data/tippmix.db')
          c = con.cursor()

          print('runs_total', c.execute('select count(*) from runs').fetchone()[0])
          print('bets_total', c.execute('select count(*) from bets').fetchone()[0])
          print('results_total', c.execute('select count(*) from results').fetchone()[0])
          print('results_usable_goals', c.execute('select count(*) from results where home_goals is not null and away_goals is not null').fetchone()[0])
          print('distinct_leagues', c.execute('select count(distinct league_id) from results where league_id is not null').fetchone()[0])
          print('distinct_teams', c.execute('select count(distinct team_id) from (select home_team_id team_id from results where home_team_id is not null union select away_team_id from results where away_team_id is not null)').fetchone()[0])
          print('updated_last_7d', c.execute("select count(*) from results where date(substr(updated_ts_utc,1,10)) >= date('now','-7 day')").fetchone()[0])

          fallback_row = c.execute("""
          WITH last_run AS ( SELECT MAX(id) AS run_id FROM runs )
          SELECT
            COUNT(*) AS bets_total,
            SUM(
              CASE
                WHEN json_extract(b.raw_json, '$.used_team_defaults') = 1
                  OR json_extract(b.raw_json, '$.used_league_defaults') = 1
                THEN 1 ELSE 0
              END
            ) AS bets_fallback,
            ROUND(
              1.0 * SUM(
                CASE
                  WHEN json_extract(b.raw_json, '$.used_team_defaults') = 1
                    OR json_extract(b.raw_json, '$.used_league_defaults') = 1
                  THEN 1 ELSE 0
                END
              ) / NULLIF(COUNT(*), 0),
              3
            ) AS fallback_ratio
          FROM bets b
          JOIN last_run lr ON b.run_id = lr.run_id
          WHERE b.tier = 'VIP';
          """).fetchone()
          print('vip_last_run_fallback', fallback_row)

          avg_row = c.execute("""
          WITH last_run AS ( SELECT MAX(id) AS run_id FROM runs )
          SELECT
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_league'),0)), 2) AS avg_n_league,
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_home'),0)), 2)   AS avg_n_home,
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_away'),0)), 2)   AS avg_n_away
          FROM bets b
          JOIN last_run lr ON b.run_id = lr.run_id
          WHERE b.tier='VIP';
          """).fetchone()
          print('vip_last_run_avg_ns', avg_row)

          con.close()
          PY
      - name: Commit recap marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Persist recap marker (DB persists via Actions cache)
          git add data/recap_sent.json || true

          if git diff --cached --quiet; then
            echo "No marker changes."
          else
            git commit -m "Update recap marker" || true
            git push
          fi
