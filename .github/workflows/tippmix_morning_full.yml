name: Tippmix Morning Full-Day Picks

on:
  schedule:
    # 06:00 Europe/Budapest (winter, CET) ~= 05:00 UTC
    # NOTE: GitHub Actions cron is UTC; in summer time (CEST) this will run at 07:00 local.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # Provider keys (use whichever you have)
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Send all channels
      TIPPMIX_SEND_PUBLIC: "1"
      TIPPMIX_SEND_VIP: "1"
      TIPPMIX_SEND_EN: "1"
      # Keep API usage minimal on free plans
      # Disable The Odds API calls by default (can override via repo vars if needed)
      ODDS_MAX_REQUESTS_PER_RUN: ${{ vars.ODDS_MAX_REQUESTS_PER_RUN || '0' }}
      ODDS_SPORT_KEYS: ${{ vars.ODDS_SPORT_KEYS || '' }}

      # Provider selection
      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER || 'api-sports' }}

      # Full-day scan (no slot cut)
      TIPPMIX_SLOT: ALL

      # PRO engine (no odds, no OpenAI)
      TIPPMIX_ENGINE: poisson

      # Make sure we actually emit picks while history builds up
      TIPPMIX_SAFE_P_MIN: "0.58"
      TIPPMIX_RISK_P_MIN: "0.54"
      TIPPMIX_TEAM_MIN_N: "6"
      TIPPMIX_LEAGUE_MIN_N: "16"
      # VIP: graceful degradation (do not go empty)
      TIPPMIX_VIP_ALLOW_DEFAULTS: "1"
      TIPPMIX_VIP_ALLOW_PARTIAL_DEFAULTS: "1"
      TIPPMIX_VIP_MIN_REAL: "4"
      TIPPMIX_VIP_MAX_FALLBACK: "3"

      # Minimum counts
      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      # Always show at least 6 important matches in VIP
      TIPPMIX_IMPORTANT_MIN: "6"
      TIPPMIX_VIP_MAIN1_COUNT: "6"
      TIPPMIX_VIP_MAIN2_COUNT: "6"
      TIPPMIX_FREE_SAFE_COUNT: "3"
      TIPPMIX_FREE_RISKY_COUNT: "3"

      # Allow MORE than minimum (send many picks)
      TIPPMIX_MAX_VIP: "18"
      TIPPMIX_MAX_FREE: "12"

      # Safe picks odds window (defaults are AllSportsAPI/free-odds friendly; override via repo vars)
      TIPPMIX_VIP_ODDS_MIN: ${{ vars.TIPPMIX_VIP_ODDS_MIN || '1.30' }}
      TIPPMIX_VIP_ODDS_MAX: ${{ vars.TIPPMIX_VIP_ODDS_MAX || '2.05' }}
      # With AllSportsAPI you may have no odds; default to not requiring odds (override via repo vars if you want)
      TIPPMIX_VIP_REQUIRE_ODDS: ${{ vars.TIPPMIX_VIP_REQUIRE_ODDS || '0' }}
      # If strict constraints produce 0 picks, allow automatic relaxation
      TIPPMIX_RELAX_IF_SHORT: ${{ vars.TIPPMIX_RELAX_IF_SHORT || '1' }}
      TIPPMIX_VIP_ODDS_MAX_RELAX: ${{ vars.TIPPMIX_VIP_ODDS_MAX_RELAX || '2.40' }}
      TIPPMIX_FREE_ODDS_MAX_RELAX: ${{ vars.TIPPMIX_FREE_ODDS_MAX_RELAX || '2.60' }}

      TIPPMIX_FREE_ODDS_MIN: ${{ vars.TIPPMIX_FREE_ODDS_MIN || '1.30' }}
      TIPPMIX_FREE_ODDS_MAX: ${{ vars.TIPPMIX_FREE_ODDS_MAX || '2.20' }}
      TIPPMIX_FREE_REQUIRE_ODDS: ${{ vars.TIPPMIX_FREE_REQUIRE_ODDS || '0' }}

      # Risky bonus combo (bigger odds)
      TIPPMIX_VIP_BONUS_COUNT: "6"
      TIPPMIX_VIP_BONUS_ODDS_MIN: "1.85"
      TIPPMIX_VIP_BONUS_ODDS_MAX: "2.80"

      # Day slot hours (used only if slot != ALL)
      TIPPMIX_DAY_START_HOUR: "8"
      TIPPMIX_DAY_END_HOUR_EXCL: "19"

      # Quality / coverage
      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}
      TIPPMIX_ALLOW_YOUTH: "0"

      # Do not expand to future days for the morning product (keeps today-only)
      TIPPMIX_MAX_DAYS_AHEAD: ${{ vars.TIPPMIX_MAX_DAYS_AHEAD || '0' }}
      TIPPMIX_MIN_POOL: ${{ vars.TIPPMIX_MIN_POOL || '21' }}
      TIPPMIX_ALLOW_FRIENDLY: "0"

      # Free tiers: avoid per-fixture odds lookups
      TIPPMIX_ODDS_LOOKUP_LIMIT: ${{ vars.TIPPMIX_ODDS_LOOKUP_LIMIT || '0' }}
      TIPPMIX_TARGET_FULL_ODDS: ${{ vars.TIPPMIX_TARGET_FULL_ODDS || '0' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore persistent Tippmix DB (cache)
        uses: actions/cache@v4
        with:
          path: |
            data/tippmix.db*
          key: tippmix-db-${{ github.run_id }}
          restore-keys: |
            tippmix-db-

      - name: Run bot (morning full-day)
        run: python -m bot.main

      - name: DB metrics (temporary)
        run: |
          python - <<'PY'
          import sqlite3

          con = sqlite3.connect('data/tippmix.db')
          c = con.cursor()

          # Core DB metrics
          print('runs_total', c.execute('select count(*) from runs').fetchone()[0])
          print('bets_total', c.execute('select count(*) from bets').fetchone()[0])
          print('results_total', c.execute('select count(*) from results').fetchone()[0])
          print('results_usable_goals', c.execute('select count(*) from results where home_goals is not null and away_goals is not null').fetchone()[0])
          print('distinct_leagues', c.execute('select count(distinct league_id) from results where league_id is not null').fetchone()[0])
          print('distinct_teams', c.execute('select count(distinct team_id) from (select home_team_id team_id from results where home_team_id is not null union select away_team_id from results where away_team_id is not null)').fetchone()[0])
          print('updated_last_7d', c.execute("select count(*) from results where date(substr(updated_ts_utc,1,10)) >= date('now','-7 day')").fetchone()[0])

          # 3 most important SQLs (latest run)
          fallback_row = c.execute("""
          WITH last_run AS ( SELECT MAX(id) AS run_id FROM runs )
          SELECT
            COUNT(*) AS bets_total,
            SUM(
              CASE
                WHEN json_extract(b.raw_json, '$.used_team_defaults') = 1
                  OR json_extract(b.raw_json, '$.used_league_defaults') = 1
                THEN 1 ELSE 0
              END
            ) AS bets_fallback,
            ROUND(
              1.0 * SUM(
                CASE
                  WHEN json_extract(b.raw_json, '$.used_team_defaults') = 1
                    OR json_extract(b.raw_json, '$.used_league_defaults') = 1
                  THEN 1 ELSE 0
                END
              ) / NULLIF(COUNT(*), 0),
              3
            ) AS fallback_ratio
          FROM bets b
          JOIN last_run lr ON b.run_id = lr.run_id
          WHERE b.tier = 'VIP';
          """).fetchone()
          print('vip_last_run_fallback', fallback_row)

          avg_row = c.execute("""
          WITH last_run AS ( SELECT MAX(id) AS run_id FROM runs )
          SELECT
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_league'),0)), 2) AS avg_n_league,
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_home'),0)), 2)   AS avg_n_home,
            ROUND(AVG(COALESCE(json_extract(b.raw_json,'$.n_away'),0)), 2)   AS avg_n_away
          FROM bets b
          JOIN last_run lr ON b.run_id = lr.run_id
          WHERE b.tier='VIP';
          """).fetchone()
          print('vip_last_run_avg_ns', avg_row)

          dq_rows = c.execute("""
          WITH last_run AS ( SELECT MAX(id) AS run_id FROM runs )
          SELECT json_extract(b.raw_json,'$.data_quality') AS dq, COUNT(*)
          FROM bets b
          JOIN last_run lr ON b.run_id = lr.run_id
          WHERE b.tier='VIP'
          GROUP BY dq
          ORDER BY COUNT(*) DESC;
          """).fetchall()
          print('vip_last_run_dq_dist', dq_rows)

          con.close()
          PY
      - name: Commit morning bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Persist picks (DB persists via Actions cache)
          git add public_bets_day.json vip_bets_day.json public_bets_day_meta.json vip_bets_day_meta.json || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Morning full-day bets $(date -u +'%Y-%m-%d')" || true
            git push
          fi
