name: Tippmix Alert Recap Runner

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pending alert recaps
        run: python -m bot.alert_recap

      - name: Commit recap state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/pending_alert_recaps.json || true

          if git diff --cached --quiet; then
            echo "No recap state changes."
          else
            git commit -m "Update pending alert recaps" || true
            git push
          fi
