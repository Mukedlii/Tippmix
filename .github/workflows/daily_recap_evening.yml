name: Tippmix Evening Recap

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC ≈ 23:00 magyar idő
    - cron: "0 22 * * *"

jobs:
  recap-evening:
    runs-on: ubuntu-latest
    env:
      TIPPMIX_SLOT: EVENING
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening recap (16–23 meccsek)
        run: python -m bot.daily_recap
