name: Tippmix Evening Recap

on:
  schedule:
    # Primary + fallback retry (runner/infra issues happen)
    # 23:00 Europe/Budapest -> 22:00 UTC
    - cron: '0 22 * * *'
    # Fallback retry: 1 hour later
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recap-evening:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}

      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening recap (16–23 meccsek)
        env:
          TIPPMIX_SLOT: EVENING
        run: python -m bot.daily_recap_main

      - name: Commit recap marker (prevents duplicate sends on fallback run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/recap_sent.json ]; then
            git add data/recap_sent.json
          fi

          if git diff --cached --quiet; then
            echo "No recap marker changes."
          else
            git commit -m "Update recap marker" || true
            git push
          fi
