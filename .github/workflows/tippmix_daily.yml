name: Tippmix Daily Tips

# Egyetlen napi futás, kizárólag ingyenes forrásokkal (SofaScore/Flashscore
# scraping + statisztikai Poisson-modell). Nincs fizetős API a workflow-ban.

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-tips:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}

      TIPPMIX_DB_PATH: data/tippmix.db
      TIPPMIX_SLOT: DAY
      TIPPMIX_ENGINE: poisson
      TIPPMIX_ENABLE_SCRAPER_PIPELINE: "1"

      TIPPMIX_SEND_PUBLIC: "1"
      TIPPMIX_SEND_VIP: "1"
      TIPPMIX_SEND_EN: "1"

      TIPPMIX_MIN_VIP: "6"
      TIPPMIX_MIN_FREE: "3"

      TIPPMIX_VIP_REQUIRE_ODDS: "0"
      TIPPMIX_FREE_REQUIRE_ODDS: "0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run tip generation (free scraping + Poisson)
        run: python -m bot.main

      - name: Generate dashboard data
        run: python scripts/generate_dashboard_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json data/tippmix.db dashboard/public/data/*.json || true
          if git diff --cached --quiet; then
            echo "Nincs változás."
          else
            git commit -m "🎯 Daily tips generated [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              git merge -X ours origin/main --no-edit --allow-unrelated-histories 2>/dev/null || true
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Push failed after retries"
                exit 1
              fi
              echo "Push failed on attempt $attempt, retrying..."
              sleep 5
            done
          fi
