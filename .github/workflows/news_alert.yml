name: Breaking News Alert

on:
  schedule:
    # Morning check (after morning tips): 07:00 UTC = 08:00 Budapest
    - cron: '0 7 * * *'
    # Midday check: 12:00 UTC = 13:00 Budapest
    - cron: '0 12 * * *'
    # Afternoon check: 15:00 UTC = 16:00 Budapest  
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-alert:
    runs-on: ubuntu-latest
    
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Check breaking news
        run: python scripts/news_alert.py
