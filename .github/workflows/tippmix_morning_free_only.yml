name: Tippmix Morning FREE Only

on:
  schedule:
    # 08:00 Europe/Budapest (winter) ~= 07:00 UTC
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  morning-free:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      # FREE-only: do not send VIP/EN
      TELEGRAM_VIP_CHAT_ID: ${{ secrets.TELEGRAM_VIP_CHAT_ID }}
      TELEGRAM_EN_CHAT_ID: ${{ secrets.TELEGRAM_EN_CHAT_ID }}
      TIPPMIX_SEND_VIP: "0"
      TIPPMIX_SEND_EN: "0"

      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TIPPMIX_USE_ENSEMBLE: "0"

      # Provider keys
      SPORTS_API_KEY: ${{ secrets.SPORTS_API_KEY }}
      SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
      SPORTSDATAIO_API: ${{ secrets.SPORTSDATAIO_API }}
      ALLSPORTSAPI_KEY: ${{ secrets.ALLSPORTSAPI_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      # Provider selection
      SPORTS_DATA_PROVIDER: ${{ vars.SPORTS_DATA_PROVIDER }}

      # Full-day scan
      TIPPMIX_SLOT: ALL

      # FREE product sizing
      TIPPMIX_MIN_FREE: "3"
      TIPPMIX_MAX_FREE: "6"
      TIPPMIX_FREE_SAFE_COUNT: "3"
      TIPPMIX_FREE_RISKY_COUNT: "3"

      # SAFE odds window for FREE (defaults are free-tier friendly; override via repo vars)
      TIPPMIX_FREE_ODDS_MIN: ${{ vars.TIPPMIX_FREE_ODDS_MIN || '1.30' }}
      TIPPMIX_FREE_ODDS_MAX: ${{ vars.TIPPMIX_FREE_ODDS_MAX || '2.20' }}
      # With AllSportsAPI you may have no odds; default to not requiring odds (override via repo vars if you want)
      TIPPMIX_FREE_REQUIRE_ODDS: ${{ vars.TIPPMIX_FREE_REQUIRE_ODDS || '0' }}

      TIPPMIX_RELAX_IF_SHORT: ${{ vars.TIPPMIX_RELAX_IF_SHORT || '1' }}
      TIPPMIX_FREE_ODDS_MAX_RELAX: ${{ vars.TIPPMIX_FREE_ODDS_MAX_RELAX || '2.60' }}

      # Keep VIP generation defaults but do not send
      TIPPMIX_MIN_VIP: "6"

      # Coverage / quality
      TIPPMIX_BLOCK_COUNTRIES: ${{ vars.TIPPMIX_BLOCK_COUNTRIES }}
      TIPPMIX_BLOCK_LEAGUES: ${{ vars.TIPPMIX_BLOCK_LEAGUES }}
      TIPPMIX_ALLOW_YOUTH: "0"
      TIPPMIX_ALLOW_FRIENDLY: "0"

      TIPPMIX_MAX_DAYS_AHEAD: ${{ vars.TIPPMIX_MAX_DAYS_AHEAD || '0' }}
      TIPPMIX_MIN_POOL: ${{ vars.TIPPMIX_MIN_POOL || '21' }}
      # Free tiers: keep per-fixture odds lookups bounded
      TIPPMIX_ODDS_LOOKUP_LIMIT: ${{ vars.TIPPMIX_ODDS_LOOKUP_LIMIT || '20' }}
      TIPPMIX_TARGET_FULL_ODDS: ${{ vars.TIPPMIX_TARGET_FULL_ODDS || '10' }}

      # The Odds API tuning
      # Free tiers are sensitive: keep odds requests bounded (override via repo vars)
      ODDS_MAX_REQUESTS_PER_RUN: ${{ vars.ODDS_MAX_REQUESTS_PER_RUN || '3' }}
      ODDS_SPORT_KEYS: "soccer_epl,soccer_spain_la_liga,soccer_italy_serie_a,soccer_germany_bundesliga,soccer_france_ligue_one,soccer_uefa_champs_league,soccer_uefa_europa_league,soccer_uefa_europa_conference_league,soccer_italy_coppa_italia,soccer_spain_copa_del_rey,soccer_netherlands_eredivisie,soccer_portugal_primeira_liga"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot (FREE only)
        run: python -m bot.main

      - name: Commit morning FREE bets JSON to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public_bets_day.json public_bets_day_meta.json || true

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Morning FREE-only bets $(date -u +'%Y-%m-%d')" || true
            git push
          fi
